<!DOCTYPE html>
<html>
<head>
<title>AlvinStudio Admin</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

.sidebar{
position:fixed;
width:240px;
height:100vh;
background:#111;
color:white;
padding:20px;
}

.logo{
font-size:28px;
font-weight:bold;
margin-bottom:40px;
}

.menu a{
display:block;
color:white;
padding:15px;
text-decoration:none;
border-radius:10px;
}

.menu a:hover{
background:#333;
}

.logout{
margin-top:40px;
background:red;
border:none;
color:white;
padding:15px;
width:100%;
border-radius:10px;
}

.content{
margin-left:280px;
padding:30px;
}

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.card{
background:white;
padding:25px;
border-radius:20px;
width:220px;
box-shadow:0 5px 20px #ddd;
}

.card h3{
color:#555;
}

.number{
font-size:35px;
font-weight:bold;
}

table{
width:100%;
background:white;
border-radius:15px;
overflow:hidden;
margin-top:30px;
}

th{
background:#111;
color:white;
padding:15px;
}

td{
padding:15px;
text-align:center;
}

.status{
padding:5px 10px;
border-radius:20px;
}

.Diterima{
background:#b8f7c1;
}

.Pending{
background:#ffe9a8;
}

.Ditolak{
background:#ffb0b0;
}

@media(max-width:700px){

.sidebar{
position:relative;
width:auto;
height:auto;
}

.content{
margin:0;
}

.cards{
flex-direction:column;
}

.card{
width:auto;
}

}
</style>

</head>


<body>


<div class="sidebar">

<div class="logo">
AlvinStudio
</div>


<div class="menu">

<a href="#dashboard">Dashboard</a>

<a href="#pesanan">Pesanan</a>

<a href="#layanan">Layanan</a>

<a href="#pelanggan">Pelanggan</a>

</div>


<button class="logout">
Logout
</button>


</div>



<div class="content">


<h1 id="dashboard">
Dashboard Admin
</h1>



<div class="cards">


<div class="card">

<h3>Total Pesanan</h3>

<div class="number" id="totalPesanan">
0
</div>

</div>



<div class="card">

<h3>Pesanan Baru</h3>

<div class="number" id="pesananBaru">
0
</div>

</div>



<div class="card">

<h3>Pelanggan</h3>

<div class="number" id="pelanggan">
0
</div>

</div>


</div>



<h2 id="pesanan">
Daftar Pesanan
</h2>


<table>

<thead>

<tr>

<th>Nama</th>

<th>Layanan</th>

<th>Status</th>

</tr>

</thead>


<tbody id="tabelPesanan">

</tbody>


</table>



<h2 id="layanan">
Layanan
</h2>

<div class="card">

<p>Haircut Basic</p>

<p>Rp25.000</p>

<p>Haircut Premium</p>

<p>Rp35.000</p>

</div>



<h2 id="pelanggan">
Data Pelanggan
</h2>


<div class="card">

<p id="jumlahPelanggan">
0 Pelanggan
</p>

</div>


</div>



<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<script src="admin.js"></script>


</body>
</html>
