<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - BarberPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    tailwind.config = {theme:{extend:{colors:{gelap:'#050505',gelap2:'#121212',emas:'#D4AF37'}}}}
  </script>
</head>
<body class="bg-gelap text-white">
<div class="min-h-screen flex flex-col md:flex-row">
  <!-- SIDEBAR -->
  <div class="w-full md:w-64 bg-gelap2 p-5">
    <div class="text-xl font-bold text-emas mb-8 flex items-center gap-2">
      <i class="fa fa-scissors"></i> BARBERPRO
    </div>
    <nav class="space-y-2">
      <button onclick="klikMenu(this)" class="w-full text-left p-3 rounded-lg bg-emas text-gelap font-bold"><i class="fa fa-home mr-2"></i> Dasbor</button>
      <button onclick="klikMenu(this)" class="w-full text-left p-3 rounded-lg hover:bg-gray-700"><i class="fa fa-calendar mr-2"></i> Reservasi</button>
      <button onclick="klikMenu(this)" class="w-full text-left p-3 rounded-lg hover:bg-gray-700"><i class="fa fa-cut mr-2"></i> Layanan</button>
      <button onclick="klikMenu(this)" class="w-full text-left p-3 rounded-lg hover:bg-gray-700"><i class="fa fa-users mr-2"></i> Tim Barber</button>
      <button onclick="klikMenu(this)" class="w-full text-left p-3 rounded-lg hover:bg-gray-700 mt-6"><i class="fa fa-cog mr-2"></i> Pengaturan</button>
      <button onclick="keluarAkun()" class="w-full text-left p-3 rounded-lg hover:bg-red-900 mt-2"><i class="fa fa-sign-out mr-2"></i> Keluar</button>
    </nav>
  </div>

  <!-- KONTEN UTAMA -->
  <div class="flex-1 p-5">
    <h1 class="text-2xl font-bold mb-6">Selamat Datang Pemilik Usaha</h1>

    <div class="grid md:grid-cols-4 gap-4 mb-8">
      <div class="bg-gelap2 p-5 rounded-xl border-l-4 border-emas">
        <p class="text-gray-400 text-sm">Reservasi Hari Ini</p>
        <h3 class="text-2xl font-bold mt-1" id="jumlahHariIni">0</h3>
      </div>
      <div class="bg-gelap2 p-5 rounded-xl border-l-4 border-blue-500">
        <p class="text-gray-400 text-sm">Total Masuk</p>
        <h3 class="text-2xl font-bold mt-1" id="jumlahTotal">0</h3>
      </div>
      <div class="bg-gelap2 p-5 rounded-xl border-l-4 border-green-500">
        <p class="text-gray-400 text-sm">Dikonfirmasi</p>
        <h3 class="text-2xl font-bold mt-1" id="jumlahKonfirm">0</h3>
      </div>
      <div class="bg-gelap2 p-5 rounded-xl border-l-4 border-purple-500">
        <p class="text-gray-400 text-sm">Dibatalkan</p>
        <h3 class="text-2xl font-bold mt-1" id="jumlahBatal">0</h3>
      </div>
    </div>

    <div class="bg-gelap2 p-6 rounded-xl">
      <h2 class="text-xl font-bold mb-4 text-emas">Daftar Reservasi Terbaru</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-gray-700 text-left">
              <th class="py-3 px-2">Nama</th>
              <th class="py-3 px-2">WA</th>
              <th class="py-3 px-2">Layanan</th>
              <th class="py-3 px-2">Pemangkas</th>
              <th class="py-3 px-2">Tanggal</th>
              <th class="py-3 px-2">Jam</th>
              <th class="py-3 px-2">Status</th>
              <th class="py-3 px-2">Aksi</th>
            </tr>
          </thead>
          <tbody id="isiReservasi">
            <tr><td colspan="8" class="py-6 text-center text-gray-400">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- AMBIL KONEKSI DARI FILE LUAR -->
<script type="module" src="script.js"></script>
<!-- FUNGSI LANGSUNG DI DALAM AGAR PASTI BERFUNGSI -->
<script>
// FUNGSI MENU NAVIGASI TANPA POP UP
function klikMenu(elemen) {
  const semuaTombol = document.querySelectorAll('nav button');
  semuaTombol.forEach(b => b.classList.remove('bg-emas','text-gelap','font-bold'));
  elemen.classList.add('bg-emas','text-gelap','font-bold');
}

// FUNGSI KELUAR
async function keluarAkun() {
  const { auth } = await import('./firebase.js');
  const { signOut } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
  try {
    await signOut(auth);
    window.location.href = "index.html";
  } catch (e) {
    alert("❌ Gagal keluar: " + e.message);
  }
}

// FUNGSI UBAH STATUS RESERVASI
window.ubahStatus = async function(id, status) {
  const { db } = await import('./firebase.js');
  const { doc, updateDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
  try {
    await updateDoc(doc(db,"bookings",id), {status: status});
    setTimeout(() => muatDataAdmin(), 500);
  } catch (err) {
    alert("❌ Gagal: " + err.message);
  }
}
</script>

</body>
</html>
