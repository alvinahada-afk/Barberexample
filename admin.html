<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Alvin Barber Studio</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>Admin Booking</h1>


<div class="admin-layout">


<div class="stats">


<!-- NOTIFIKASI -->

<div id="notifArea">

<button id="notifButton" onclick="bukaNotif()">

🔔 <span id="notifCount">0</span>

</button>


<div id="notifBox" class="notif-dropdown">


<h3>Booking Baru</h3>


<div id="notifList">

Belum ada booking baru

</div>


</div>


</div>




<!-- STATISTIK -->


<div class="stat-card">

<h2 id="totalBooking">0</h2>

<p>Total Booking</p>

</div>



<div class="stat-card">

<h2 id="pendingBooking">0</h2>

<p>Pending</p>

</div>



<div class="stat-card">

<h2 id="acceptedBooking">0</h2>

<p>Diterima</p>

</div>



<div class="stat-card">

<h2 id="rejectedBooking">0</h2>

<p>Ditolak</p>

</div>



<div class="stat-card">

<h2 id="totalPendapatan">

Rp0

</h2>

<p>Total Pendapatan</p>

</div>



</div>


</div>




<button onclick="logout()">

Logout

</button>

<button onclick="location.href='customizer.html'">

🎨 Customizer Website

</button>




<!-- FILTER -->


<div class="filter">


<button onclick="filterBooking('Semua')">

Semua

</button>


<button onclick="filterBooking('Pending')">

Pending

</button>



<button onclick="filterBooking('Diterima')">

Diterima

</button>



<button onclick="filterBooking('Ditolak')">

Ditolak

</button>


</div>





<div class="booking-area">



<input

type="text"

id="searchBooking"

placeholder="🔍 Cari nama atau nomor WhatsApp..."

onkeyup="searchBooking()"

>






<!-- KALENDER -->


<div class="calendar-box">


<h2>
📅 Kalender Booking
</h2>



<input

type="month"

id="bulanKalender"

onchange="buatKalender()"

>




<div id="kalender">

</div>



</div>





<h2>

📋 Jadwal Booking

</h2>




<div id="jadwalHari">

Pilih tanggal kalender

</div>




<div id="bookingList">

Memuat data...

</div>




</div>






<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script src="firebase.js"></script>


<script type="module" src="./admin.js"></script>

</body>

</html>
